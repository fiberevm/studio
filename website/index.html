<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio: a Mac workspace for coding agents</title>
<meta name="description" content="A hands-on tour of Studio, the free macOS app that runs Claude Code, Codex and Antigravity sessions in tabs and split panes and shows which one is waiting for you.">
<meta property="og:type" content="website">
<meta property="og:title" content="Studio: a Mac workspace for coding agents">
<meta property="og:description" content="Take the tour: tabs of live agent sessions, ⌘J to whoever needs you, splits, terminals, web panels, the palette and nine themes.">
<meta property="og:image" content="share.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f1f2f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0e13" media="(prefers-color-scheme: dark)">
<style>
/* ------------------------------------------------------------------ the page around the window */
:root {
  --page: #f1f2f5; --page-2: #e6e8ed; --ink: #15171c; --ink-2: #5b606b; --line: rgb(0 0 0 / .1);
  --card: #ffffff; --card-line: rgb(0 0 0 / .08); --orange: #e8875a; --orange-ink: #1a1208; --ring: #4a9eff;
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --page: #0c0e13; --page-2: #141821; --ink: #eef0f4; --ink-2: #9aa1ae; --line: rgb(255 255 255 / .09);
          --card: #1b1f29; --card-line: rgb(255 255 255 / .1); }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 15px/1.5 var(--ui); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
kbd { font: 500 .86em/1 var(--ui); padding: .2em .45em; border-radius: 5px; border: 1px solid var(--line); background: var(--page-2); white-space: nowrap; }

html, body { height: 100%; overflow: hidden; }
body { background: #191d27; }
.frame { position: fixed; inset: 0; }
/* the demo pointer (the macOS arrow), its click ripple, the line that types itself, a tab being dragged */
.ptr { position: fixed; z-index: 60; left: 0; top: 0; width: 24px; height: 26px; margin: -2px 0 0 -3px; pointer-events: none; opacity: 0; filter: drop-shadow(0 2px 3px rgb(0 0 0 / .45)); }
.ptr.on { opacity: 1; }
.ptr svg { display: block; transition: transform .12s; transform-origin: 3px 2px; }
.ptr.down svg { transform: scale(.84); }
.rip { position: fixed; z-index: 59; width: 38px; height: 38px; margin: -19px 0 0 -19px; border-radius: 50%; border: 2px solid #fff; pointer-events: none; animation: rip .55s ease-out forwards; }
@keyframes rip { from { transform: scale(.2); opacity: .95; } to { transform: scale(1.4); opacity: 0; } }
.say { position: fixed; z-index: 61; left: 0; top: 0; padding: 9px 14px; border-radius: 10px; background: #fff; color: #111; font: 600 17px/1.2 var(--ui); letter-spacing: -.01em;
       white-space: nowrap; box-shadow: 0 10px 30px rgb(0 0 0 / .35); pointer-events: none; opacity: 0; }
.say.on { opacity: 1; }
.say::after { content: ""; display: inline-block; width: 2px; height: 1em; margin-left: 2px; vertical-align: -2px; background: #e8875a; animation: blink 1s steps(1) infinite; }
.ghost { position: fixed; z-index: 58; left: 0; top: 0; height: 35px; display: flex; align-items: center; gap: 8px; padding: 0 16px; font: 12px var(--ui); transform-origin: 0 0;
         box-shadow: 0 6px 18px rgb(0 0 0 / .35); pointer-events: none; opacity: 0; white-space: nowrap; }
/* the opening: what Studio is, typed in the middle, before the show */
.intro { position: fixed; inset: 0; z-index: 62; display: grid; place-content: center; gap: 14px; padding: 24px; text-align: center; pointer-events: none;
         background: rgb(10 12 18 / .78); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); opacity: 0; transition: opacity .6s; }
.intro.on { opacity: 1; }
.intro b { font: 650 clamp(30px, 5vw, 60px)/1.08 var(--ui); letter-spacing: -.03em; color: #fff; min-height: 1.08em; }
.intro b::after { content: ""; display: inline-block; width: .06em; height: .9em; margin-left: .05em; vertical-align: -.08em; background: #e8875a; animation: blink 1s steps(1) infinite; }
.intro span { font: 500 clamp(15px, 1.6vw, 19px)/1.4 var(--ui); color: rgb(255 255 255 / .62); min-height: 1.4em; }
/* the end: the whole window darkens under a download title and button */
.end { position: fixed; inset: 0; z-index: 63; display: grid; place-content: center; justify-items: center; gap: 16px; padding: 24px; text-align: center;
       background: rgb(8 10 14 / .86); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); opacity: 0; visibility: hidden; transition: opacity .7s, visibility 0s .7s; }
.end.on { opacity: 1; visibility: visible; transition: opacity .7s; }
.end img { width: 88px; height: 88px; margin-bottom: 4px; }
.end h1 { margin: 0; font: 650 clamp(34px, 5.4vw, 64px)/1.05 var(--ui); letter-spacing: -.03em; color: #fff; }
.end p { margin: 0; font: 500 clamp(15px, 1.6vw, 19px)/1.4 var(--ui); color: rgb(255 255 255 / .62); }
.end__dl { display: inline-flex; align-items: center; gap: 10px; margin-top: 10px; height: 54px; padding: 0 26px; border-radius: 12px; background: #fff; color: #111;
           font: 600 18px var(--ui); text-decoration: none; transition: transform .15s, box-shadow .15s; box-shadow: 0 10px 30px rgb(0 0 0 / .4); }
.end__dl:hover { transform: translateY(-1px); box-shadow: 0 14px 36px rgb(0 0 0 / .5); }
.end__dl svg { width: 20px; height: 20px; }
.end__more { display: flex; gap: 22px; margin-top: 6px; font: 500 14px var(--ui); }
.end__more a, .end__more button { color: rgb(255 255 255 / .6); text-decoration: none; background: none; border: 0; padding: 0; font: inherit; cursor: pointer; }
.end__more a:hover, .end__more button:hover { color: #fff; }
.nudge.hot { animation: hot 1.2s ease-in-out infinite; }
@keyframes hot { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 35%, transparent); } }
@media (max-width: 639px) { .say { font-size: 15px; } }

/* ------------------------------------------------------------------ the Studio window, at its real point sizes */
.win { --sec: rgb(255 255 255 / .55); --ter: rgb(255 255 255 / .26); --pri: rgb(255 255 255 / .86); --hover: rgb(255 255 255 / .04);
       position: absolute; left: 0; top: 0; transform-origin: 0 0; display: flex; flex-direction: column; overflow: hidden;
       background: var(--chrome); color: var(--pri); font: 13px/1.2 var(--ui); cursor: default; user-select: none; -webkit-user-select: none; }
.win.light { --sec: rgb(0 0 0 / .5); --ter: rgb(0 0 0 / .25); --pri: rgb(0 0 0 / .85); --hover: rgb(0 0 0 / .04); }
.win svg { display: block; flex: none; }
.wbody, .overlay, .peek { pointer-events: none; }
.titlebar { position: relative; height: 28px; flex: none; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 90px; }
.titlebar b { font-size: 13px; font-weight: 600; }
.titlebar .dash { color: var(--ter); }
.titlebar > span { font-size: 12px; color: var(--sec); }
/* the right of the title bar, where the app puts its update pill: the download, in that pill's style */
.tb-right { position: absolute; right: 10px; top: 0; height: 28px; display: flex; align-items: center; gap: 12px; }
.tb-gh { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: var(--sec); text-decoration: none; }
.tb-gh:hover { color: var(--pri); }
.nudge { display: flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 99px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 500; text-decoration: none; }
.nudge:hover { filter: brightness(1.1); }
.lights { position: absolute; left: 10px; top: 9px; display: flex; gap: 11px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 .5px rgb(0 0 0 / .18); }
.lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
.hair { height: 1px; background: var(--border); flex: none; }
.vhair { width: 1px; background: var(--border); flex: none; align-self: stretch; }
.wbody { flex: 1; min-height: 0; display: flex; }

.sidebar { width: 236px; flex: none; display: flex; flex-direction: column; background: var(--chrome); }
.sb__head { height: 30px; display: flex; align-items: center; padding: 0 8px 0 16px; font-size: 11px; font-weight: 600; color: var(--sec); }
.sb__head .plus { margin-left: auto; width: 20px; height: 20px; display: grid; place-items: center; }
.sb__sec { height: 24px; display: flex; align-items: center; gap: 6px; padding: 0 16px; font-size: 10px; font-weight: 600; color: var(--sec); }
.count { font-size: 10px; font-weight: 600; padding: 0 5px; background: color-mix(in srgb, var(--pri) 12%, transparent); font-variant-numeric: tabular-nums; }
.sb__rows { flex: 1; }
.srow { height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 16px; font-size: 13px; color: var(--sec); cursor: pointer; }
.srow > span:first-child { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.srow.att > span:first-child { font-weight: 600; }
.srow.sel { background: var(--sel); color: var(--pri); }
.srow:not(.sel):hover { background: var(--hover); }
.sb__busy { height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 12px; font-size: 11px; font-weight: 600; color: var(--sec); background: var(--chrome); }
.sb__busy .spin { margin-left: auto; }

.layout { flex: 1; min-width: 0; display: flex; }
.split { flex: 1; min-width: 0; min-height: 0; display: flex; }
.split.v { flex-direction: column; }
.pdiv { flex: none; background: var(--divider); width: .5px; }
.split.v > .pdiv { width: auto; height: .5px; }
.group { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
.tabstrip { height: 35px; flex: none; display: flex; background: var(--chrome); }
.tab { position: relative; height: 35px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 16px; font-size: 12px; color: var(--sec); white-space: nowrap; cursor: pointer; }
.tab:hover { background: var(--hover); }
.tab.sel { background: var(--bg); z-index: 1; }
.tab.sel.act { color: var(--pri); }
.tab.sel.act::before { content: ""; position: absolute; inset: 0 0 auto; height: 1px; background: var(--accent); }
.tab.sel::after { content: ""; position: absolute; inset: auto 0 -1px; height: 1px; background: var(--bg); }
.tab .x { width: 16px; height: 16px; display: grid; place-items: center; opacity: 0; color: var(--sec); }
.tab.sel .x, .tab:hover .x { opacity: 1; }
.tab .ico { width: 12px; display: grid; place-items: center; color: var(--sec); }
.newtab { width: 30px; display: grid; place-items: center; color: var(--sec); }
.pane { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--bg); }
.statusbar { height: 28px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 10px; background: var(--chrome); font-size: 11px; color: var(--sec); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
.stat { display: flex; align-items: center; gap: 4px; }
.chip { display: flex; align-items: center; gap: 4px; }
.chip i { width: 5px; height: 5px; border-radius: 50%; background: #34c759; }

/* status marks */
.mark { width: 14px; height: 12px; display: grid; place-items: center; flex: none; }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.spin { width: 12px; height: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; flex: none; }
.spin i { border-radius: 1px; background: color-mix(in srgb, var(--fg) 16%, transparent); animation: walk 1.2s steps(1) infinite; }
.spin i:nth-child(2) { animation-delay: .3s; } .spin i:nth-child(4) { animation-delay: .6s; } .spin i:nth-child(3) { animation-delay: .9s; }
@keyframes walk { 0%, 24% { background: #e8875a; } }

/* the terminal, as Claude Code draws it */
.term { position: absolute; inset: 0; padding: 4px 8px; display: flex; flex-direction: column; font: 12px/15px var(--mono); color: var(--fg); white-space: pre; overflow: hidden; user-select: text; -webkit-user-select: text; }
.term__out { flex: 1; min-height: 0; overflow: hidden; }
.term__in { flex: none; }
.ln { min-height: 15px; overflow: hidden; text-overflow: clip; }
.wrap { white-space: pre-wrap; padding-left: 2ch; text-indent: -2ch; }
.d { opacity: .55; } .b { font-weight: 700; } .y { color: var(--a11); } .bl { color: var(--a12); } .g { color: var(--a2); } .r { color: var(--a9); } .or { color: #d77757; }
.band { background: var(--band); padding-left: 2ch; }
.rule { height: 15px; display: flex; align-items: center; } .rule::before { content: ""; flex: 1; height: 1px; background: color-mix(in srgb, var(--fg) 80%, transparent); }
.rule.perm::before { background: var(--a12); }
.cur { display: inline-block; width: 7.2px; height: 15px; vertical-align: top; background: var(--cursor); }
.cur.hollow { background: none; box-shadow: inset 0 0 0 1px var(--cursor); }
.logo { display: flex; gap: 14px; align-items: center; margin: 15px 0 15px 2px; }
.logo svg { width: 65px; height: 37px; }
.popt { cursor: pointer; } .popt:hover { background: var(--hover); }
.popt.on { color: var(--a12); }
.star { color: #d77757; display: inline-block; width: 1ch; }

/* the web panel */
.webbar { height: 34px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 8px; background: var(--chrome); }
.webbar .btn { width: 22px; height: 22px; display: grid; place-items: center; color: var(--sec); }
.addr { flex: 1; height: 24px; display: flex; align-items: center; padding: 0 8px; font-size: 12px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--divider); color: var(--pri); }
.webview { position: absolute; inset: 35px 0 0; background: #fff; color: #17181c; font: 14px/1.45 var(--ui); overflow: hidden; }
.shop { display: flex; flex-direction: column; height: 100%; }
.shop__nav { height: 48px; display: flex; align-items: center; gap: 20px; padding: 0 24px; border-bottom: 1px solid #ececec; font-size: 13px; color: #555; }
.shop__nav b { color: #111; font-size: 15px; margin-right: auto; }
.shop__main { padding: 24px; display: grid; gap: 14px; }
.shop__main h3 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
.line { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 13.5px; }
.line.total { font-weight: 600; border: 0; }
.shop__pay { align-self: start; height: 38px; padding: 0 18px; border-radius: 8px; background: #111; color: #fff; display: inline-flex; align-items: center; font-size: 13.5px; font-weight: 500; width: max-content; }

/* overlays: the palette, the quick prompt, the peek card, the drop preview, a toast */
.overlay { position: absolute; left: 50%; top: 34px; transform: translateX(-50%); z-index: 20; width: 620px; padding-bottom: 4px; background: var(--chrome);
           box-shadow: inset 0 0 0 1px var(--border), 0 4px 20px rgb(0 0 0 / .3); }
.field { margin: 6px; height: 30px; display: flex; align-items: center; padding: 0 10px; font-size: 13px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--accent); color: var(--pri); white-space: pre; }
.field .ph { color: var(--ter); }
.field .caret { width: 1px; height: 15px; background: var(--pri); margin-left: 1px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.prow { height: 26px; display: flex; align-items: center; gap: 8px; padding: 0 12px; cursor: pointer; }
.prow.on { background: var(--sel); }
.prow .lead { width: 14px; display: grid; place-items: center; color: var(--sec); }
.prow .t { font-size: 13px; white-space: nowrap; }
.prow .s { font-size: 12px; color: var(--sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .r { margin-left: auto; padding-left: 8px; font-size: 11px; color: var(--sec); white-space: nowrap; }
.prow .tick { width: 13px; height: 13px; border-radius: 3px; box-shadow: inset 0 0 0 1px var(--sec); display: grid; place-items: center; color: #fff; }
.prow .tick.on { background: var(--accent); box-shadow: none; }
.qsec { height: 20px; padding: 2px 12px 0; display: flex; align-items: center; font-size: 10px; font-weight: 600; color: var(--sec); }
.qfoot { padding: 6px 12px; font-size: 11px; color: var(--ter); }
.peek { position: absolute; z-index: 15; width: 400px; padding: 12px; display: grid; gap: 6px; background: var(--chrome); box-shadow: inset 0 0 0 1px var(--divider), 0 6px 20px rgb(0 0 0 / .25); }
.peek__t { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
.peek__s { font-size: 11px; color: var(--sec); }
.peek__r { font-size: 12px; line-height: 1.4; color: var(--pri); }
.peek__you { font-size: 11px; color: var(--sec); } .peek__you b { font-weight: 600; margin-right: 4px; }
.drop { position: absolute; z-index: 10; background: color-mix(in srgb, var(--accent) 18%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 60%, transparent); transition: all .1s; pointer-events: none; }
.toast { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); z-index: 25; padding: 7px 14px; font-size: 12px; border-radius: 6px; background: var(--chrome); color: var(--pri);
         box-shadow: inset 0 0 0 1px var(--border), 0 4px 16px rgb(0 0 0 / .3); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .pulse, .spin i, .field .caret, .say::after, .nudge.hot { animation: none !important; } }
</style>
</head>

<main id="top" aria-label="A guided tour of Studio">
  <div class="frame" id="frame"><div class="win" id="win"></div></div>

<script>
// Download links give the Apple silicon build. Chromium browsers say whether the Mac is Intel: there, every one
// gives the Intel build instead (Safari doesn't tell; the end screen has an Intel Mac link)
(() => {
  const uad = navigator.userAgentData;
  if (!uad || !uad.getHighEntropyValues) return;
  uad.getHighEntropyValues(['architecture']).then(v => {
    if (v.architecture !== 'x86') return;
    document.addEventListener('click', e => {
      const a = e.target.closest && e.target.closest('a[href$="/Studio-arm64.dmg"]');
      if (a) a.href = a.href.replace('Studio-arm64.dmg', 'Studio-x86_64.dmg');
    }, true);
  }).catch(() => {});
})();
</script>
<script>
(() => {
/* ================================================================ themes, as Themes.swift defines them */
const T = {
  'clear-dark':     { name: 'Clear Dark (Terminal.app)', light: 0, bg: '#212734', chrome: '#191D27', fg: '#E6E6E6', sel: '#334E5E', border: 'rgba(255,255,255,.08)', accent: '#4A9EFF', cursor: '#D97857', ansi: ['#35424B','#B4564A','#6CAA71','#C4AC62','#6D96B4','#BD7BCD','#7CCBCD','#DDE5EB','#465D6C','#DF6C5A','#79BD7D','#E5C872','#67B5ED','#D389E5','#84DDE0','#E6EEF5'] },

  if (o.kind === 'quick') {
    const targets = [['co', 'Checkout refactor', '⌘1'], ['au', 'Fix flaky auth spec', '⌘2'], ['bi', 'Migrate billing tables', '⌘3']];
    return `<div class="overlay" data-overlay="quick"><div class="field">${o.text ? esc(o.text) + '<span class="caret"></span>' : '<span class="ph">Message a session, or ⇥ to pick several</span>'}</div>
      <div class="qsec">SESSIONS</div>${targets.map(([id, t, k], i) => `<div class="prow${i === o.index ? ' on' : ''}" data-q="${id}"><span class="lead"><span class="tick${o.ticked.includes(id) ? ' on' : ''}">${o.ticked.includes(id) ? I.tick : ''}</span></span><span class="t">${t}</span><span class="r">${k}</span></div>`).join('')}
      <div class="prow" data-q="new"><span class="lead">${I.plus}</span><span class="t">New session with this message</span><span class="r">⌘N</span></div>
      <div class="qfoot">↵ send or open   ⇥ add to broadcast   ⌘↵ new session   esc close</div></div>`;
  }
  return '';
}
function peekHTML() {
  if (!s.peek) return '';
  const p = PEEK[s.peek], t = s.tabs[s.peek];
  return `<div class="peek" data-peek="${s.peek}"><div class="peek__t">${mark(t.status)}${esc(t.title)}</div><div class="peek__s">${p.status}</div><div class="peek__r">${esc(p.reply)}</div><div class="peek__you"><b>You</b>${esc(p.you)}</div></div>`;
}

let starI = 0;
function render() {
  applyTheme(s.theme);
  win.innerHTML = `<div class="titlebar"><div class="lights"><i></i><i></i><i></i></div><b>shop</b><span class="dash">—</span><span>~/code/shop</span><span class="tb-right"><a class="tb-gh" href="https://github.com/fiberevm/studio">GitHub</a><a class="nudge" href="https://github.com/fiberevm/studio/releases/latest/download/Studio-arm64.dmg"><svg width="11" height="11" viewBox="0 0 12 12"><circle cx="6" cy="6" r="6" fill="currentColor" opacity=".9"/><path d="M6 3v5M3.8 6l2.2 2.2L8.2 6" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Download Studio for macOS</a></span></div><div class="hair"></div>
    <div class="wbody">${s.sidebar ? sidebarHTML() : ''}<div class="layout">${nodeHTML(s.layout)}</div></div>
    ${overlayHTML()}${peekHTML()}${s.drop ? `<div class="drop" style="${s.drop}"></div>` : ''}${s.toast ? `<div class="toast">${esc(s.toast)}</div>` : ''}`;
  if (s.peek) placePeek();
  win.querySelectorAll('.star').forEach(el => { el.textContent = STARS[starI % STARS.length]; });
  win.querySelectorAll('.term__out').forEach(el => { el.scrollTop = el.scrollHeight; });
}
// the working star turns like Claude Code's
setInterval(() => { starI++; win.querySelectorAll('.star').forEach(el => { el.textContent = STARS[starI % STARS.length]; }); }, 160);

function rel(el) { // an element's box in the window's own (unscaled) points
  const w = win.getBoundingClientRect(), r = el.getBoundingClientRect(), k = scale;
  return { x: (r.left - w.left) / k, y: (r.top - w.top) / k, w: r.width / k, h: r.height / k };
}
function placePeek() {
  const tab = win.querySelector(`.tab[data-tab="${s.peek}"]`), card = win.querySelector('.peek');
  if (!tab || !card) return;
  const r = rel(tab), Wd = win.offsetWidth;
  card.style.left = Math.max(0, Math.min(r.x, Wd - 400)) + 'px'; card.style.top = (r.y + r.h + 4) + 'px';
}

/* ================================================================ fitting the window to the screen */
let scale = 1;
const intro = document.getElementById('intro');
function fit() {
  // the window is the page; below 820 points wide it is drawn smaller, so its layout never squeezes
  scale = Math.min(1, innerWidth / 820);
  const Wd = innerWidth / scale, Hd = innerHeight / scale;
  win.style.width = Wd + 'px'; win.style.height = Hd + 'px'; win.style.transform = `scale(${scale})`;
  intro.style.top = 29 * scale + 'px';   // the title bar, and its download, stay visible over the opening
  if (s.peek) placePeek();
}
addEventListener('resize', fit);

/* ================================================================ the demo: a pointer shows where to click, a line types itself */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const introH = intro.querySelector('b'), introS = intro.querySelector('span');
const ptr = document.getElementById('ptr'), cap = document.getElementById('say'), capText = cap.querySelector('span'), ghost = document.getElementById('ghost');
class Stop extends Error {}
let gen = 0, demoOn = false, idleT, px = innerWidth * .55, py = innerHeight * .6;
const sleep = ms => new Promise(r => setTimeout(r, reduced ? Math.min(ms, 300) : ms));
async function wait(g, ms) { await sleep(ms); if (g !== gen) throw new Stop(); }
function placeCap() {
  const w = cap.offsetWidth, h = cap.offsetHeight;
  let x = px + 20, y = py + 28;
  if (x + w > innerWidth - 12) x = px - w - 16;
  if (y + h > innerHeight - 12) y = py - h - 16;
  cap.style.left = Math.max(12, x) + 'px'; cap.style.top = Math.max(12, y) + 'px';
}
function ease(el, dur) { el.style.transition = reduced || !dur ? 'opacity .3s' : `left ${dur}ms cubic-bezier(.5,0,.2,1), top ${dur}ms cubic-bezier(.5,0,.2,1), opacity .3s`; }
function setPtr(x, y, dur) { px = x; py = y; ease(ptr, dur); ease(cap, dur); ptr.style.left = x + 'px'; ptr.style.top = y + 'px'; placeCap(); }
function at(sel, fx = .5, fy = .5) {
  const el = win.querySelector(sel); if (!el) return [px, py];
  const r = el.getBoundingClientRect(); return [r.left + r.width * fx, r.top + r.height * fy];
}
const scr = (x, y) => { const w = win.getBoundingClientRect(); return [w.left + x * scale, w.top + y * scale]; };
async function move(g, sel, fx, fy, dur = 850) { const [x, y] = at(sel, fx, fy); setPtr(x, y, dur); await wait(g, dur + 60); }
async function click(g) {
  ptr.classList.add('down');
  const rip = document.createElement('i'); rip.className = 'rip'; rip.style.left = px + 'px'; rip.style.top = py + 'px';
  document.body.appendChild(rip); setTimeout(() => rip.remove(), 600);
  await wait(g, 140); ptr.classList.remove('down'); await wait(g, 120);
}
async function line(g, text) {
  cap.classList.add('on'); capText.textContent = '';
  for (let i = 1; i <= text.length; i++) { capText.textContent = text.slice(0, i); placeCap(); if (!reduced) await wait(g, 36); }
}
async function typeIn(g, set, text, every = 45) { for (let i = 1; i <= text.length; i++) { set(text.slice(0, i)); render(); await wait(g, every); } }

function split(st) { st.layout = { dir: 'h', kids: [{ g: 'g1' }, { g: 'g2' }], fr: [.56, .44] }; st.groups.g1 = { tabs: ['co', 'au'], sel: st.groups.g1.sel === 'bi' ? 'co' : st.groups.g1.sel }; st.groups.g2 = { tabs: ['bi'], sel: 'bi' }; st.active = 'g2'; }
function addTerminal(st) { st.layout.kids[1] = { dir: 'v', kids: [{ g: 'g2' }, { g: 'g3' }], fr: [.52, .48] }; st.groups.g3 = { tabs: ['sh'], sel: 'sh' }; st.tabs.sh = { kind: 'shell', title: 'zsh — shop', screen: 'sh' }; st.active = 'g3'; }

async function demo(g) {
  {
    s = fresh(); render(); cap.classList.remove('on'); ptr.classList.add('on');
    setPtr(innerWidth * .5, innerHeight * .62, 0); ptr.classList.remove('on');
    // first, what it is: typed in the middle, then the show
    intro.classList.add('on'); introH.textContent = ''; introS.textContent = '';
    await wait(g, 500);
    for (const [el, text, every] of [[introH, 'All your coding agents in one window.', 55], [introS, 'Studio for Mac  ·  Claude Code, Codex and Antigravity', 22]]) {
      for (let i = 1; i <= text.length; i++) { el.textContent = text.slice(0, i); if (!reduced) await wait(g, every); }
      await wait(g, 350);
    }
    await wait(g, 1500);
    intro.classList.remove('on'); ptr.classList.add('on');
    await wait(g, 700);

    await move(g, '.tab[data-tab="co"]', .55, .6);
    await line(g, 'Every tab is an agent');
    await wait(g, 1500);

    s.tabs.au.status = 'waiting'; s.tabs.au.screen = 'au'; render();
    await move(g, '.tab[data-tab="au"]', .5, .6, 650);
    await line(g, 'Red: it needs you');
    await wait(g, 900);
    s.tabs.bi.status = 'done'; s.tabs.bi.screen = 'bi'; render();
    await line(g, '⌘J jumps right to it');
    await wait(g, 700); await click(g);
    selectTab('au'); render();
    await wait(g, 1800);

    await move(g, '.tab[data-tab="bi"]', .55, .6);
    await line(g, 'Hover to peek');
    s.peek = 'bi'; render(); await wait(g, 2000); s.peek = null; render();

    // drag the tab to the right half
    await line(g, 'Drag to split');
    const t = T[s.theme], tr = rel(win.querySelector('.tab[data-tab="bi"]')), Wd = win.offsetWidth, Hd = win.offsetHeight;
    const [gx, gy] = scr(tr.x, tr.y);
    Object.assign(ghost.style, { transition: 'none', left: gx + 'px', top: gy + 'px', transform: `scale(${scale})`, background: t.bg, color: t.fg, opacity: .94 });
    ghost.querySelector('span').textContent = s.tabs.bi.title;
    ptr.classList.add('down'); await wait(g, 200);
    const [ex, ey] = scr(Wd * .7, Hd * .45);
    ease(ghost, 950); ghost.style.left = ex - 60 * scale + 'px'; ghost.style.top = ey - 17 * scale + 'px';
    s.drop = `left:${Wd * .56}px;top:64px;width:${Wd * .44}px;height:${Hd - 64}px`; render();
    setPtr(ex, ey, 950); await wait(g, 1050);
    ptr.classList.remove('down'); ghost.style.opacity = 0; s.drop = null; split(s); render();
    await wait(g, 900);

    await move(g, '.group[data-group="g2"] .pane', .5, .72);
    await line(g, '⌃` opens a terminal');
    await wait(g, 800); addTerminal(s); render(); await wait(g, 1300);

    await move(g, '.group[data-group="g2"] .newtab', .5, .5);
    await line(g, 'Open your app beside it'); await click(g);
    s.groups.g2.tabs.push('wb'); s.tabs.wb = { kind: 'web', title: 'New tab', url: '', host: 'localhost' }; s.groups.g2.sel = 'wb'; s.active = 'g2'; render();
    await move(g, '.addr', .2, .5, 500);
    await typeIn(g, v => { s.tabs.wb.url = v; }, 'localhost:5173/checkout', 40);
    s.tabs.wb.url = 'http://localhost:5173/checkout'; s.tabs.wb.title = 'Shop — Checkout'; render();
    await wait(g, 1400);

    await move(g, '.titlebar', .45, .6);
    await line(g, '⌘P finds any session');
    await wait(g, 400);
    s.overlay = { kind: 'palette', mode: 'main', query: '', index: 0 }; render();
    await wait(g, 600);
    await typeIn(g, v => { s.overlay.query = v; }, 'bill', 110);
    await move(g, '.prow.on', .3, .5, 600); await click(g);
    s.overlay = null; selectTab('bi'); render();
    await wait(g, 900);

    await line(g, '⇧⌘K messages many');
    s.overlay = { kind: 'quick', text: '', ticked: ['co'], index: 0 }; render();
    await typeIn(g, v => { s.overlay.text = v; }, 'rebase on main and rerun the tests', 38);
    await move(g, '.prow[data-q="au"] .tick', .5, .5, 600); await click(g);
    s.overlay.ticked = ['co', 'au']; s.overlay.index = 1; render();
    await wait(g, 700);
    s.overlay = null; s.tabs.co.status = 'working'; s.tabs.au.status = 'working'; s.tabs.au.screen = 'auRun'; s.toast = 'Sent to 2 sessions'; render();
    await wait(g, 1500); s.toast = null; render();

    await move(g, '.titlebar', .45, .6, 600);
    await line(g, 'Nine themes, live');
    s.overlay = { kind: 'palette', mode: 'themes', query: '', index: 0 }; render();
    for (const id of ['dark-modern', 'monokai', 'light-plus', 'github-dark', 'one-dark-pro']) {
      await move(g, `.prow[data-theme="${id}"]`, .2, .5, 420);
      s.overlay.index = THEME_IDS.indexOf(id); s.theme = id; render(); await wait(g, 700);
    }
    await click(g); s.overlay = null; render(); await wait(g, 900);

    await line(g, '⌘B: who is waiting');
    s.sidebar = true; render();
    await move(g, '.sidebar', .45, .22, 700); await wait(g, 1800);

    // the end: dark out the window, then the download
    ptr.classList.remove('on'); cap.classList.remove('on');
    document.getElementById('end').classList.add('on');
  }
}
function start() { gen++; document.getElementById('end').classList.remove('on'); demo(gen).catch(e => { if (!(e instanceof Stop)) console.error(e); }); }
document.getElementById('again').addEventListener('click', start);

function selectTab(id, g) {
  g = g || Object.keys(s.groups).find(k => s.groups[k].tabs.includes(id));
  if (!g) return;
  s.groups[g].sel = id; s.active = g; s.peek = null;
  if (s.tabs[id].status === 'done') s.tabs[id].status = 'idle';   // reading it clears the unread mark, like the app
}

fit(); start();
if (document.fonts) document.fonts.ready.then(fit);
})();
</script>
