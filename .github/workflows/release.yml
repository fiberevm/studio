# Builds Studio.app on every version tag (v1.2.3), signs and notarizes it when the Apple secrets are set,
# and publishes Studio.dmg (drag-to-Applications installer), Studio.zip and appcast.xml (the in-app update feed) to a GitHub release. Without the secrets it still publishes an ad hoc build.
#
# Secrets (Settings → Secrets and variables → Actions):
#   MACOS_CERT_P12          base64 of your "Developer ID Application" certificate + private key (.p12)
#   MACOS_CERT_PASSWORD     the .p12 password
#   and for notarization, either an App Store Connect API key:
#   NOTARY_KEY_P8           base64 of the key (.p8), role Developer
#   NOTARY_KEY_ID           that key's ID
#   NOTARY_ISSUER_ID        the issuer ID shown above the keys list
#   or an Apple ID:
#   NOTARY_APPLE_ID         the developer account's Apple ID
#   NOTARY_PASSWORD         an app-specific password for it (account.apple.com)
#   NOTARY_TEAM_ID          the team ID (10 characters)
#   and for in-app updates (Sparkle):
#   SPARKLE_PRIVATE_KEY     the EdDSA update key (Sparkle's generate_keys -x <file>; its public half is
#                           SPARKLE_PUBLIC_KEY below). With it the build updates itself from appcast.xml on the
#                           latest release; without it the release is published as before, with no updater feed.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Public half of the update key: installed copies only accept updates signed with the private half.
      SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' && 'sT/zgufKv0MQDCvoriLkZb0QiHlHQ8eOSULEaKCVZ3M=' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Select Xcode
        run: |
          # Newest stable Xcode 26 (SwiftTerm 1.99 needs Swift 6.2+)
          X=$(ls -d /Applications/Xcode_26*.app | grep -viE 'beta|rc' | sort -V | tail -1)
          sudo xcode-select -s "${X:-/Applications/Xcode.app}"
          swift --version

      - name: Import signing certificate
        id: cert
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "No signing certificate: building ad hoc"; exit 0; fi
          KC="$RUNNER_TEMP/release.keychain-db"; KC_PW=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          ID=$(security find-identity -v -p codesigning "$KC" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')
          [ -n "$ID" ] || { echo "No Developer ID Application identity in the .p12"; exit 1; }
          echo "identity=$ID" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          SIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          swift package resolve
          UNIVERSAL=1 VERSION="${TAG#v}" BUILD_NUMBER="${{ github.run_number }}" APP=build/release/Studio.app ./build-app.sh

      - uses: actions/setup-go@v5
        with:
          go-version-file: worker/go.mod
          cache-dependency-path: worker/go.sum

      - name: Build studio-worker
        run: |
          # the machine side of Workers: static binaries for Linux and macOS
          cd worker
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -trimpath -ldflags "-s -w -X main.version=${TAG#v}" \
              -o ../build/release/studio-worker-${t%/*}-${t#*/} .
          done
          ls -la ../build/release/studio-worker-*

      - name: Notarize
        if: steps.cert.outputs.identity != ''
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          if [ -n "$NOTARY_KEY_P8" ]; then
            echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            export NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
          fi
          scripts/notarize.sh build/release/Studio.app build/release/Studio.zip
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Zip (ad hoc build)
        if: steps.cert.outputs.identity == ''
        run: ditto -c -k --keepParent build/release/Studio.app build/release/Studio.zip

      - name: Disk image
        env:
          SIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          # the drag-to-Applications installer (window layout written by dmgbuild, no Finder needed)
          pipx install dmgbuild
          scripts/make-dmg.sh build/release/Studio.app build/release/Studio.dmg

      - name: Notarize disk image
        if: steps.cert.outputs.identity != ''
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          if [ -n "$NOTARY_KEY_P8" ]; then
            echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            export NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
          fi
          scripts/notarize.sh build/release/Studio.dmg
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # appcast.xml: what installed copies poll (releases/latest/download/appcast.xml) to update themselves
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then echo "No SPARKLE_PRIVATE_KEY: this release has no update feed"; exit 0; fi
          scripts/make-appcast.sh build/release/Studio.zip "${TAG#v}" "${{ github.run_number }}" \
            "https://github.com/${{ github.repository }}/releases/download/$TAG/Studio.zip" > build/release/appcast.xml
          cat build/release/appcast.xml

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.cert.outputs.identity != '' }}
        run: |
          cd build/release
          shasum -a 256 Studio.dmg Studio.zip | tee Studio.sha256
          shasum -a 256 studio-worker-* | tee studio-worker.sha256
          {
            echo "**Install:** download \`Studio.dmg\`, open it and drag Studio to Applications (or use \`Studio.zip\`). Universal (Apple silicon and Intel), macOS 14+. Needs [Claude Code](https://docs.claude.com/en/docs/claude-code) (or Codex, or Antigravity); \`brew install tmux\` recommended."
            echo
            echo "**Workers:** on a Linux or macOS machine you want to run sessions on, \`curl -fsSL https://raw.githubusercontent.com/fiberevm/studio/main/install-worker.sh | sh\`, then pair it in Settings → Workers."
            echo
            if [ "$SIGNED" != "true" ]; then
              echo "> **This build isn't notarized yet**, so macOS blocks it on first launch. After moving it to Applications, run once:"
              echo "> \`\`\`"
              echo "> xattr -dr com.apple.quarantine /Applications/Studio.app"
              echo "> \`\`\`"
              echo "> or open it, then allow it in System Settings → Privacy & Security → *Open Anyway*."
              echo
            fi
          } > notes.md
          FEED=""; [ -f appcast.xml ] && FEED=appcast.xml
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Studio.dmg Studio.zip Studio.sha256 studio-worker-* studio-worker.sha256 $FEED --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" Studio.dmg Studio.zip Studio.sha256 studio-worker-* studio-worker.sha256 $FEED --title "Studio ${TAG#v}" --notes-file notes.md --generate-notes
          fi

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
