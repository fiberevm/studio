<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Studio: four sessions in a 2×2 pane grid (the app's working indicator); the one that needs you is lit. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3142"/>
      <stop offset="1" stop-color="#0F1218"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#333B4E"/>
      <stop offset="1" stop-color="#252B39"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6A877"/>
      <stop offset="1" stop-color="#D65F33"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EE8A5C" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#EE8A5C" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- macOS tile -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- glow behind the lit pane -->
  <circle cx="370" cy="370" r="260" fill="url(#halo)"/>

  <!-- the three quiet panes, each with a hint of text -->
  <g filter="url(#lift)">
    <rect x="532" y="224" width="268" height="268" rx="56" fill="url(#pane)"/>
    <rect x="224" y="532" width="268" height="268" rx="56" fill="url(#pane)"/>
    <rect x="532" y="532" width="268" height="268" rx="56" fill="url(#pane)"/>
  </g>
  <g>
    <rect x="576" y="300" width="150" height="20" rx="10" fill="#8A93A6"/>
    <rect x="576" y="342" width="108" height="20" rx="10" fill="#5E677B"/>
    <rect x="576" y="384" width="132" height="20" rx="10" fill="#5E677B"/>
    <rect x="268" y="608" width="132" height="20" rx="10" fill="#8A93A6"/>
    <rect x="268" y="650" width="160" height="20" rx="10" fill="#5E677B"/>
    <rect x="268" y="692" width="96" height="20" rx="10" fill="#5E677B"/>
    <rect x="576" y="608" width="120" height="20" rx="10" fill="#8A93A6"/>
    <rect x="576" y="650" width="150" height="20" rx="10" fill="#5E677B"/>
  </g>
  <rect x="533" y="225" width="266" height="266" rx="55" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  <rect x="225" y="533" width="266" height="266" rx="55" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  <rect x="533" y="533" width="266" height="266" rx="55" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- the lit pane: a prompt -->
  <g filter="url(#lift)">
    <rect x="224" y="224" width="268" height="268" rx="56" fill="url(#lit)"/>
  </g>
  <rect x="225" y="225" width="266" height="266" rx="55" fill="none" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="2"/>
  <path d="M 294 306 L 362 358 L 294 410" fill="none" stroke="#FFFFFF" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="384" y="392" width="62" height="30" rx="9" fill="#FFFFFF" fill-opacity="0.92"/>
</svg>
