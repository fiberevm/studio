<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- tile -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#323B50"/>
      <stop offset="1" stop-color="#141821"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
    <!-- window -->
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252C3B"/>
      <stop offset="1" stop-color="#1D2330"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0A070"/>
      <stop offset="1" stop-color="#D9663A"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E9875A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E9875A" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="win">
      <rect x="196" y="236" width="632" height="552" rx="44"/>
    </clipPath>
  </defs>

  <!-- macOS tile: 824×824 squircle-ish rounded rect inset 100 -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- the app window -->
  <g filter="url(#shadow)">
    <rect x="196" y="236" width="632" height="552" rx="44" fill="url(#pane)"/>
  </g>
  <g clip-path="url(#win)">
    <!-- title bar -->
    <rect x="196" y="236" width="632" height="64" fill="#161A23"/>
    <circle cx="240" cy="268" r="11" fill="#FF5F57"/>
    <circle cx="276" cy="268" r="11" fill="#FEBC2E"/>
    <circle cx="312" cy="268" r="11" fill="#28C840"/>
    <!-- sidebar -->
    <rect x="196" y="300" width="200" height="488" fill="#181D28"/>
    <rect x="396" y="300" width="2" height="488" fill="#FFFFFF" fill-opacity="0.07"/>
    <!-- session rows: label + status dot -->
    <rect x="214" y="330" width="166" height="40" rx="8" fill="#334E5E" fill-opacity="0.85"/>
    <rect x="230" y="345" width="96" height="10" rx="5" fill="#E6EEF5" fill-opacity="0.85"/>
    <circle cx="358" cy="350" r="8" fill="#5FD68A"/>
    <rect x="230" y="393" width="80" height="10" rx="5" fill="#E6EEF5" fill-opacity="0.40"/>
    <circle cx="358" cy="398" r="8" fill="#F0A35E"/>
    <rect x="230" y="441" width="104" height="10" rx="5" fill="#E6EEF5" fill-opacity="0.40"/>
    <circle cx="358" cy="446" r="8" fill="#5AA8F0"/>
    <!-- tab strip -->
    <rect x="398" y="300" width="430" height="50" fill="#181D28"/>
    <rect x="398" y="300" width="176" height="50" fill="url(#pane)"/>
    <rect x="398" y="300" width="176" height="3" fill="#4A9EFF"/>
    <rect x="426" y="321" width="110" height="9" rx="4.5" fill="#E6EEF5" fill-opacity="0.75"/>
    <rect x="574" y="300" width="2" height="50" fill="#FFFFFF" fill-opacity="0.07"/>
    <rect x="600" y="321" width="84" height="9" rx="4.5" fill="#E6EEF5" fill-opacity="0.30"/>
    <!-- conversation lines -->
    <rect x="436" y="392" width="300" height="11" rx="5.5" fill="#E6EEF5" fill-opacity="0.30"/>
    <rect x="436" y="420" width="250" height="11" rx="5.5" fill="#E6EEF5" fill-opacity="0.22"/>
    <rect x="436" y="448" width="276" height="11" rx="5.5" fill="#E6EEF5" fill-opacity="0.22"/>
    <!-- prompt: chevron + cursor, with a warm glow -->
    <circle cx="560" cy="600" r="190" fill="url(#halo)"/>
    <path d="M 452 532 L 552 600 L 452 668" fill="none" stroke="url(#glow)" stroke-width="40"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="590" y="638" width="120" height="34" rx="9" fill="url(#glow)"/>
  </g>
  <rect x="197" y="237" width="630" height="550" rx="43" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="2"/>
</svg>
